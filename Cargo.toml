[workspace]
members = ["src-tauri"]
resolver = "3"

[package]
name = "opul_core"
version = "0.1.0"
edition = "2024"

[lib]
name = "opul_core"
crate-type = ["lib"]

[dependencies]
hex = "0.4"
fs2 = "0.4"
librqbit = { version = "9.0.1", default-features = false, features = ["http-api-client", "rust-tls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "v5", "serde"] }
