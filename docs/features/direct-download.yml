# Direct file downloads. Statuses reflect the Opul tree on 2026-11-17.
features:
  - id: direct-http-downloads
    title: Direct HTTP downloads
    category: direct-download
    source: opul-original
    status: shipped
    priority: null
    summary: Paste a direct file link and Opul saves that file without video tools.
    notes: Compatible video, audio, image, and subtitle responses use a Rust HTTP path with resumable partials, bounded redirects, a media-type check, and a collision-safe name. Format selection and post-processing stay on yt-dlp.
    reason: null
    issue: null
    added: 2026-11-17
    updated: 2026-11-17

  - id: link-kind-detection
    title: Link kind detection
    category: direct-download
    source: opul-original
    status: shipped
    priority: null
    summary: Opul treats magnets and .torrent links as torrents, common file suffixes as files, and asks when a link is ambiguous.
    notes: The prompt offers File, Video or playlist, or Torrent. Video is unavailable until video tools are turned on.
    reason: null
    issue: null
    added: 2026-11-17
    updated: 2026-11-17

  - id: browser-capture
    title: Browser capture
    category: direct-download
    source: competitor:folx
    status: planned
    priority: p1
    summary: Send links and downloads from Safari, Chrome, or Firefox to Opul with a browser extension.
    notes: "No browser extension or messaging host sends links into Opul. Magnet links and .torrent files are separate entries (magnet-handler, torrent-file-association). Folx, Free Download Manager, Motrix (browser extension 0.1.25 with download handoff, Nov 2026), Downie, Grabbit, Convoy, and WDM ship browser capture."
    reason: null
    issue: null
    added: 2026-11-23
    updated: 2026-11-23

  - id: segmented-downloads
    title: Segmented downloads
    category: direct-download
    source: competitor:motrix
    status: planned
    priority: p1
    summary: Speed up large direct downloads by fetching a file over several connections at once.
    notes: "A direct file uses one HTTP connection. A partial file can resume with a Range request, and several files can run at once. Nothing fetches one file over several connections. Folx, Free Download Manager, Motrix (aria2), Progressive Downloader, and Convoy (16 connections) do. It is a top ask in r/macapps best download manager threads."
    reason: null
    issue: null
    added: 2026-11-23
    updated: 2026-11-23
