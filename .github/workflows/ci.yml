name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust and Swift
        run: Scripts/test.sh
      - name: Package an ad-hoc signed app
        run: SIGNING_MODE=adhoc Scripts/package_app.sh debug
      - name: Verify signature
        run: codesign --verify --deep --strict Opul.app
