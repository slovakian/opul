name: CI

on:
  push:
    branches: [main, integration/58-opul-managed-tools]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 24
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Fetch pinned built-in tools
        run: Scripts/fetch_ffmpeg.sh
      - name: Lint and type-check frontend
        run: vp check
      - name: Run frontend unit tests
        run: vp test
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test Python runtime manifest and signature contract
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          python3 tools/python-runtime/test_release.py
          python3 tools/python-runtime/test_notices.py
      - name: Reject corrupted built-in tools
        run: Scripts/test_ffmpeg_fetch.sh
      - name: Test offline compatibility workflow contracts
        run: python3 tools/compatibility/test_check.py
      - name: Check packaging configuration
        run: Scripts/test_packaging.sh
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check Rust compilation
        run: cargo check

  test-rust:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch pinned built-in tools
        run: Scripts/fetch_ffmpeg.sh
      - name: Run Rust unit and workspace tests
        run: cargo test --workspace

  test-e2e:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
        include:
          - shard: "1/2"
            shard-index: 1
          - shard: "2/2"
            shard-index: 2
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 24
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: pnpm exec playwright install webkit
      - name: Run Playwright tests (shard ${{ matrix.shard }})
        run: pnpm exec playwright test --shard=${{ matrix.shard }}
      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-results-shard-${{ matrix.shard-index }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  package-smoke:
    runs-on: macos-26
    needs: [check, test-rust, test-e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 24
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Package the Tauri app
        run: Scripts/package_app.sh debug
      - name: Launch the packaged app
        run: Scripts/smoke_test.sh
      - name: Upload smoke test failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-artifacts
          path: |
            test-results/
            /tmp/opul-smoke*
          if-no-files-found: ignore

  package-dmg:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 24
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Package nightly DMG without notarization credentials
        env:
          APPLE_ID: ""
          APPLE_PASSWORD: ""
          APPLE_TEAM_ID: ""
          MARKETING_VERSION: 0.1.0-nightly.${{ github.run_number }}
        run: Scripts/package_dmg.sh release nightly "${{ matrix.arch }}"
      - name: Upload verified single-architecture DMG
        uses: actions/upload-artifact@v4
        with:
          name: managed-tools-dmg-${{ matrix.arch }}
          path: Opul-Nightly-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7
