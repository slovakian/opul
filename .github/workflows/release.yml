name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
      DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "::error::The SPARKLE_PRIVATE_KEY secret is missing."; exit 1; }
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          IFS=. read -r major minor patch <<<"${latest#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          case "$BUMP" in
            major) major=$((major + 1)) minor=0 patch=0 ;;
            minor) minor=$((minor + 1)) patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          echo "Releasing $version (previous: ${latest:-none})"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Test
        run: Scripts/test.sh

      - name: Import Developer ID certificate
        if: env.DEVELOPER_ID_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$DEVELOPER_ID_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          test -n "$identity" || { echo "::error::No Developer ID Application identity in the certificate."; exit 1; }
          echo "APP_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build universal app and disk image
        run: |
          ARCHES="arm64 x86_64" MARKETING_VERSION="$VERSION" Scripts/package_app.sh release
          test "$(lipo -archs Opul.app/Contents/MacOS/Opul | tr ' ' '\n' | sort | xargs)" = "arm64 x86_64"
          test "$(lipo -archs Opul.app/Contents/Frameworks/libopul_core.dylib | tr ' ' '\n' | sort | xargs)" = "arm64 x86_64"
          Scripts/package_dmg.sh

      - name: Notarize
        if: env.APP_IDENTITY != ''
        run: |
          xcrun notarytool submit Opul.dmg --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple Opul.dmg
          spctl --assess --type open --context context:primary-signature --verbose Opul.dmg

      - name: Write release notes and appcast
        run: |
          mkdir dist
          mv Opul.dmg dist/
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" --jq .body > dist/Opul.md
          echo "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --embed-release-notes \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/" \
            --full-release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
            --link "https://opul.procka.org" \
            dist
          grep -q "<sparkle:version>$VERSION</sparkle:version>" dist/appcast.xml
          cat dist/appcast.xml

      - name: Publish release
        run: |
          {
            cat dist/Opul.md
            echo
            echo "**Install:** download \`Opul.dmg\` and drag Opul to Applications. First-launch steps: https://opul.procka.org/download/"
            echo
            echo "Opul checks for updates automatically after it is installed."
          } > "$RUNNER_TEMP/body.md"
          gh release create "v$VERSION" dist/Opul.dmg dist/appcast.xml \
            --target "$GITHUB_SHA" --title "Opul $VERSION" --notes-file "$RUNNER_TEMP/body.md"

      - name: Verify what users download
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          curl -fsSL --retry 5 --retry-all-errors "$base/appcast.xml" -o "$RUNNER_TEMP/appcast.xml"
          grep -q "<sparkle:version>$VERSION</sparkle:version>" "$RUNNER_TEMP/appcast.xml"
          curl -fsSL --retry 5 --retry-all-errors "$base/Opul.dmg" -o "$RUNNER_TEMP/Opul.dmg"
          test "$(shasum -a 256 < "$RUNNER_TEMP/Opul.dmg")" = "$(shasum -a 256 < dist/Opul.dmg)"
          signature=$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' "$RUNNER_TEMP/appcast.xml")
          echo "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/sign_update --verify --ed-key-file - "$RUNNER_TEMP/Opul.dmg" "$signature"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt" "$RUNNER_TEMP/Opul.dmg"
          test "$(plutil -extract CFBundleShortVersionString raw "$RUNNER_TEMP/mnt/Opul.app/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict "$RUNNER_TEMP/mnt/Opul.app"
          hdiutil detach "$RUNNER_TEMP/mnt"
