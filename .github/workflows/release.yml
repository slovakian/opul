name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
      DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: Scripts/test.sh
      - name: Choose version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          IFS=. read -r major minor patch <<<"${latest#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          case "$BUMP" in
            major) major=$((major + 1)) minor=0 patch=0 ;;
            minor) minor=$((minor + 1)) patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "VERSION=$major.$minor.$patch" >> "$GITHUB_ENV"
          echo "PREVIOUS_TAG=$latest" >> "$GITHUB_ENV"
      - name: Import optional Developer ID certificate
        if: env.DEVELOPER_ID_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$DEVELOPER_ID_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build universal Tauri app and disk image
        run: |
          ARCHES="arm64 x86_64" MARKETING_VERSION="$VERSION" Scripts/package_dmg.sh
          test "$(lipo -archs target/universal-apple-darwin/release/Opul | tr ' ' '\n' | sort | xargs)" = "arm64 x86_64"
          codesign --verify --deep --strict target/universal-apple-darwin/release/bundle/macos/Opul.app
      - name: Publish release
        run: |
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' ${PREVIOUS_TAG:+"$PREVIOUS_TAG..HEAD"}
            echo
            echo "Install Opul.dmg manually. This Tauri release replaces the Swift interface and Sparkle updater."
            echo "Existing libraries are retained. Quit older copies of Opul before opening this version."
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" Opul.dmg --target "$GITHUB_SHA" --title "Opul $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Verify the public download
        run: |
          curl -fsSL --retry 5 --retry-all-errors "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Opul.dmg" -o "$RUNNER_TEMP/Opul.dmg"
          test "$(shasum -a 256 < "$RUNNER_TEMP/Opul.dmg")" = "$(shasum -a 256 < Opul.dmg)"
